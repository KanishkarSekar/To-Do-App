<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="todo-app">

            <!-- Header -->
            <div class="header">
                <div>
                    <p class="tag">YOUR DAILY PLANNER</p>
                    <h1>My To-Do List </h1>
                    <p class="subtitle">Stay organized, one task at a time.</p>
                </div>

                <div class="icon">☑</div>
            </div>

            <!-- Add Task -->
            <div class="row">
                <input type="text" id="input-box" placeholder="What needs to be done?">
                <button class="button" id="add-btn">+ Add Task</button>
            </div>

            <!-- Task Heading -->
            <div class="task-heading">
                <h3>My Tasks</h3>
                <span id="task-count">0/0 completed</span>
            </div>

            <!-- Task List -->
            <ul id="list-container"></ul>

            <!-- Empty Message -->
            <p id="empty-message">No tasks yet. Add your first task!</p>

            <!-- Footer -->
            <p class="footer"> Small steps every day lead to big results.</p>

        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>

            <p class="modal-subtitle">Update your task below.</p>

            <input type="text" id="edit-input" placeholder="Enter task name">

            <div class="modal-buttons">
                <button class="cancel-btn" id="cancel-btn">Cancel</button>
                <button class="save-btn" id="save-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
